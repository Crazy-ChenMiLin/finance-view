name: Living Architecture CI/CD

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every 6 hours
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full rebuild of all snapshots'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install --production=false
          fi

      - name: Build Living Architecture Site
        run: |
          node scripts/build-site.js

      - name: Security & Sanitization Audit
        run: |
          node -e "require('./scripts/security-sanitizer').sanitizeAndVerifyDirectory('./dist')"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
